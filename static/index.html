<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LootSync - Gestão de Assets e Produtos Digitais</title>
    <style>
        :root {
            --bg-color: #0f1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --text-color: #c9d1d9;
            --accent-color: #58a6ff;
            --btn-hover: #1f6feb;
            --danger-color: #f85149;
            --danger-hover: #da3633;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            color: var(--accent-color);
            margin-bottom: 5px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        h2 {
            font-size: 1.2rem;
            margin-top: 0;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        label {
            font-size: 0.9rem;
        }

        input, textarea {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 10px;
            color: var(--text-color);
            font-size: 0.9rem;
        }

        button {
            background-color: var(--accent-color);
            color: #ffffff;
            border: none;
            border-radius: 6px;
            padding: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--btn-hover);
        }

        .produto-item {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 10px;
            position: relative;
        }

        .produto-item h3 {
            margin: 0 0 5px 0;
            color: var(--accent-color);
            font-size: 1rem;
        }

        .tag {
            display: inline-block;
            background-color: #21262d;
            border: 1px solid var(--border-color);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.75rem;
            margin-right: 5px;
            margin-top: 8px;
        }

        .btn-delete {
            background-color: var(--danger-color);
            font-size: 0.75rem;
            padding: 5px 10px;
            float: right;
            margin-top: -5px;
        }

        .btn-delete:hover {
            background-color: var(--danger-hover);
        }
    </style>
</head>
<body>

    <header>
        <h1>LootSync</h1>
        <p>Sistema de Gestão de Catálogo e Versões - SyncedCorp</p>
    </header>

    <div class="container">
        <!-- Formulário de Cadastro -->
        <div class="card">
            <h2>Cadastrar Novo Asset</h2>
            <form id="form-produto">
                <label>Nome do Asset:</label>
                <input type="text" id="nome" required placeholder="Ex: Pack de Sprites Viking">

                <label>Tipo:</label>
                <input type="text" id="tipo" required placeholder="Ex: Sprite, Áudio, Script, Build">

                <label>Versão:</label>
                <input type="text" id="versao" required placeholder="Ex: v1.0.0">

                <label>Tamanho / Licença:</label>
                <input type="text" id="tamanho" required placeholder="Ex: 15MB">

                <label>Descrição:</label>
                <textarea id="descricao" rows="3" placeholder="Detalhes do asset..."></textarea>

                <button type="submit">Salvar Asset</button>
            </form>
        </div>

        <!-- Lista de Produtos -->
        <div class="card">
            <h2>Catálogo de Assets</h2>
            <div id="lista-produtos">
                <p>Carregando produtos...</p>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "http://127.0.0.1:8000";

        // Função para buscar e exibir os produtos da API
        async function carregarProdutos() {
            try {
                const response = await fetch(`${API_URL}/produtos/`);
                const produtos = await response.json();
                
                const container = document.getElementById("lista-produtos");
                container.innerHTML = "";

                if (produtos.length === 0) {
                    container.innerHTML = "<p>Nenhum asset cadastrado ainda.</p>";
                    return;
                }

                produtos.forEach(p => {
                    const div = document.createElement("div");
                    div.className = "produto-item";
                    div.innerHTML = `
                        <button class="btn-delete" onclick="deletarProduto(${p.id})">Excluir</button>
                        <h3>${p.nome}</h3>
                        <p style="margin: 5px 0; font-size: 0.85rem;">${p.descricao}</p>
                        <div>
                            <span class="tag">Tipo: ${p.tipo}</span>
                            <span class="tag">Ver: ${p.versao}</span>
                            <span class="tag">Tam: ${p.tamanho}</span>
                        </div>
                    `;
                    container.appendChild(div);
                });
            } catch (error) {
                console.error("Erro ao carregar produtos:", error);
                document.getElementById("lista-produtos").innerHTML = "<p style='color: #f85149;'>Erro ao conectar com a API.</p>";
            }
        }

        // Função para deletar um produto
        async function deletarProduto(id) {
            if (!confirm("Tem certeza que deseja excluir este asset?")) return;

            try {
                const response = await fetch(`${API_URL}/produtos/${id}`, {
                    method: "DELETE"
                });

                if (response.ok) {
                    carregarProdutos(); // Atualiza a lista na tela
                } else {
                    alert("Erro ao excluir o produto.");
                }
            } catch (error) {
                console.error("Erro na requisição:", error);
                alert("Erro de conexão com o servidor.");
            }
        }

        // Evento para cadastrar novo produto via formulário
        document.getElementById("form-produto").addEventListener("submit", async (e) => {
            e.preventDefault();

            const novoProduto = {
                nome: document.getElementById("nome").value,
                tipo: document.getElementById("tipo").value,
                versao: document.getElementById("versao").value,
                tamanho: document.getElementById("tamanho").value,
                descricao: document.getElementById("descricao").value
            };

            try {
                const response = await fetch(`${API_URL}/produtos/`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(novoProduto)
                });

                if (response.ok) {
                    document.getElementById("form-produto").reset();
                    carregarProdutos(); // Atualiza a lista na tela
                } else {
                    alert("Erro ao cadastrar produto.");
                }
            } catch (error) {
                console.error("Erro na requisição:", error);
                alert("Erro de conexão com o servidor.");
            }
        });

        // Carrega os produtos assim que a página abre
        carregarProdutos();
    </script>
</body>
</html>
